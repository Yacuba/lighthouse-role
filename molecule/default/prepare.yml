---
- name: Prepare host with Nginx web server
  hosts: all
  gather_facts: true
  tasks:
    - name: Install EPEL repository
      become: true
      ansible.builtin.dnf:
        name: epel-release
        state: present

    - name: Install Nginx, git, curl and tar
      become: true
      ansible.builtin.dnf:
        name:
          - nginx
          - git
          - curl
          - tar
        state: present

    - name: Deploy clean Nginx base configuration
      become: true
      ansible.builtin.copy:
        dest: /etc/nginx/nginx.conf
        mode: "0644"
        content: |
          user nginx;
          worker_processes auto;
          error_log /var/log/nginx/error.log notice;
          pid /run/nginx.pid;
          include /usr/share/nginx/modules/*.conf;
          events {
              worker_connections 1024;
          }
          http {
              log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                              '$status $body_bytes_sent "$http_referer" '
                              '"$http_user_agent" "$http_x_forwarded_for"';
              access_log /var/log/nginx/access.log main;
              sendfile on;
              tcp_nopush on;
              keepalive_timeout 65;
              types_hash_max_size 4096;
              include /etc/nginx/mime.types;
              default_type application/octet-stream;
              include /etc/nginx/conf.d/*.conf;
          }

    - name: Ensure Nginx conf.d directory exists
      become: true
      ansible.builtin.file:
        path: /etc/nginx/conf.d
        state: directory
        mode: "0755"

    - name: Ensure Nginx service is started and enabled
      become: true
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
      when: ansible_facts.service_mgr | default('') == 'systemd'
