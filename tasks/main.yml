---
# tasks file for lighthouse-role
- name: Create web root directory for Lighthouse
  become: true
  ansible.builtin.file:
    path: "{{ lighthouse_dir }}"
    state: directory
    mode: "0755"
    owner: "{{ lighthouse_user }}"
    group: "{{ lighthouse_group }}"

- name: Download Lighthouse archive
  ansible.builtin.get_url:
    url: "{{ lighthouse_url }}"
    dest: "{{ lighthouse_archive_dest }}"
    mode: "0644"
    timeout: 30
  register: download_lighthouse
  until: download_lighthouse is not failed
  retries: 5
  delay: 3

- name: Extract Lighthouse archive
  become: true
  ansible.builtin.unarchive:
    src: "{{ lighthouse_archive_dest }}"
    dest: "{{ lighthouse_dir }}"
    remote_src: true
    extra_opts:
      - "--strip-components=1"
    owner: "{{ lighthouse_user }}"
    group: "{{ lighthouse_group }}"

- name: Apply SELinux file context to Lighthouse web root
  become: true
  ansible.builtin.file:
    path: "{{ lighthouse_dir }}"
    setype: httpd_sys_content_t
    recurse: true
    state: directory
  when:
    - ansible_facts.selinux is defined
    - ansible_facts.selinux.status | default('') == 'enabled'

- name: Deploy Nginx site configuration for Lighthouse
  become: true
  ansible.builtin.template:
    src: lighthouse.conf.j2
    dest: "{{ lighthouse_nginx_conf_dest }}"
    mode: "0644"
  notify: Reload Nginx service
